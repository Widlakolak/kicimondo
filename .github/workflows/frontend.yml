name: Frontend

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --global npm@11.11.0
      - run: npm ci --engine-strict
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  android-debug:
    needs: checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'build-tools;36.0.0'
      - run: npm install --global npm@11.11.0
      - run: npm ci --engine-strict
      - run: npm run build:android
      - run: ./gradlew --no-daemon --max-workers=4 assembleDebug
        working-directory: frontend/android
      - name: Verify and name the universal debug APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk kicimondo-debug.apk
          bash scripts/verify-apk.sh kicimondo-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: kicimondo-debug
          path: frontend/kicimondo-debug.apk
          if-no-files-found: error
