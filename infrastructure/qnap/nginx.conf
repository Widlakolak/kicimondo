worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    types { application/manifest+json webmanifest; }
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    sendfile on;

    server {
        listen 8080;
        root /usr/share/nginx/html;

        location = / {
            rewrite ^ /index.html last;
        }

        location ~ "^/assets/[a-zA-Z0-9_-]+-[a-zA-Z0-9_-]{8}\.[a-zA-Z0-9]+$" {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri @retained_assets;
        }

        location @retained_assets {
            root /var/lib/kicimondo;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        location ~ ^/api/v1/content/packs(?:/[a-z][a-z0-9-]*/(?:latest|versions/[0-9]+))?$ {
            limit_except GET OPTIONS { deny all; }
            # Docker DNS is queried at request time so the static server can start alone.
            resolver 127.0.0.11 valid=3s ipv6=off;
            resolver_timeout 2s;
            set $content_backend kicimondo-backend:8080;
            proxy_pass http://$content_backend;
            proxy_set_header Host $host;
            proxy_set_header Cookie "";
            proxy_set_header Authorization "";
            proxy_set_header Content-Length "";
            proxy_pass_request_body off;
            proxy_connect_timeout 2s;
            proxy_send_timeout 4s;
            proxy_read_timeout 4s;
            proxy_cache off;
            proxy_intercept_errors on;
            error_page 403 =403 @content_forbidden;
            error_page 502 503 504 =503 @content_unavailable;
        }

        location @content_forbidden {
            default_type application/problem+json;
            add_header Cache-Control "no-store" always;
            return 403 '{"title":"Forbidden","status":403}';
        }

        location @content_unavailable {
            default_type application/problem+json;
            add_header Cache-Control "no-store" always;
            return 503 '{"title":"Content service unavailable","status":503}';
        }

        location /api {
            default_type application/problem+json;
            return 404 '{"title":"Not Found","status":404}';
        }

        location / {
            add_header Cache-Control "no-cache" always;
            try_files $uri =404;
        }
    }
}
